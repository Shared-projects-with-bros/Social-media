<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FEIBUK</title>

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <!-- Nuestro CSS -->
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

  <!-- Barra superior -->
  <nav class="navbar navbar-dark bg-primary sticky-top shadow-sm mb-4">
    <div class="container feed-container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span class="navbar-brand mb-0 h1">📘 FEIBUK</span>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" id="btnModeracion" class="btn btn-sm btn-outline-light" data-bs-toggle="modal" data-bs-target="#modalModeracion">🚨 Moderación</button>
        <button type="button" id="btnExportar" class="btn btn-sm btn-light">⬇️ Exportar</button>
        <button type="button" id="btnImportar" class="btn btn-sm btn-outline-light">⬆️ Importar</button>
        <input type="file" id="inputImportar" accept=".json,application/json" class="d-none">
      </div>
    </div>
  </nav>

  <div class="container feed-container pb-5">

    <!-- Resumen de actividad (Historia 10) -->
    <div class="row text-center g-2 mb-4" id="resumenActividad">
      <div class="col-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body py-3">
            <div class="fs-4 fw-bold text-primary" id="resumenPublicaciones">0</div>
            <div class="text-muted small">Publicaciones</div>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body py-3">
            <div class="fs-4 fw-bold text-danger" id="resumenReacciones">0</div>
            <div class="text-muted small">Reacciones</div>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body py-3">
            <div class="fs-4 fw-bold text-success" id="resumenComentarios">0</div>
            <div class="text-muted small">Comentarios</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario para publicar -->
    <div class="card mb-4 border-0 shadow-sm">
      <div class="card-body">
        <h2 class="card-title h6 text-muted">¿Qué estás pensando?</h2>

        <form id="formPublicar">
          <div class="row g-2">
            <div class="col-12 col-sm-8 mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre">
            </div>
            <div class="col-12 col-sm-4 mb-3">
              <label for="etiquetaPublicar" class="form-label">Tema</label>
              <select id="etiquetaPublicar" class="form-select">
                <option value="General" selected>General</option>
                <option value="Estudio">Estudio</option>
                <option value="Evento">Evento</option>
                <option value="Ayuda">Ayuda</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="3" maxlength="200" placeholder="Escribe tu mensaje"></textarea>
            <div class="form-text text-end" id="contadorMensaje">200 caracteres restantes</div>
          </div>

          <button type="submit" class="btn btn-primary">Publicar</button>
          <button type="button" id="btnDescartarBorrador" class="btn btn-outline-secondary btn-sm">Descartar borrador</button>
        </form>
      </div>
    </div>

    <!-- Buscar, filtrar y ordenar (Historias 8, 9 y 15) -->
    <div class="card mb-4 border-0 shadow-sm">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-12 col-md-6">
            <label for="buscar" class="form-label">Buscar</label>
            <input type="search" class="form-control" id="buscar" placeholder="Buscar por nombre o mensaje...">
          </div>
          <div class="col-6 col-md-3">
            <label for="filtroEtiqueta" class="form-label">Tema</label>
            <select id="filtroEtiqueta" class="form-select">
              <option value="todas" selected>Todas</option>
              <option value="General">General</option>
              <option value="Estudio">Estudio</option>
              <option value="Evento">Evento</option>
              <option value="Ayuda">Ayuda</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label for="ordenar" class="form-label">Ordenar por</label>
            <select id="ordenar" class="form-select">
              <option value="recientes" selected>Recientes</option>
              <option value="antiguas">Antiguas</option>
              <option value="populares">Más gustadas</option>
            </select>
          </div>
        </div>
        <div class="row g-2 mt-1 align-items-center">
          <div class="col-auto">
            <button type="button" id="btnBuscar" class="btn btn-outline-primary btn-sm">Buscar</button>
          </div>
          <div class="col-auto form-check">
            <input class="form-check-input" type="checkbox" id="soloFavoritas">
            <label class="form-check-label" for="soloFavoritas">Mostrar solo favoritas ⭐</label>
          </div>
        </div>
      </div>
    </div>

    <!-- Aquí van a aparecer las publicaciones -->
    <div id="listaPublicaciones"></div>

    <!-- Controles de paginación (Historia 18) -->
    <div id="controlesPaginacion" class="d-flex justify-content-center align-items-center mt-3 mb-4"></div>

  </div>

  <!-- Vista de Moderación (Historia 20) -->
  <div class="modal fade" id="modalModeracion" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">🚨 Moderación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="listaModeracion"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Nuestro JS -->
  <script src="../js/app.js"></script>
</body>
</html>
