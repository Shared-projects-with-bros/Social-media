<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FEIBUK</title>

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <!-- Nuestro CSS -->
  <link rel="stylesheet" href="../css/estilos.css"> 
</head>
<body>

  <div class="container mt-4">

    <h1 class="text-center mb-4">FEIBUK</h1>

    <!-- Formulario para publicar -->
    <div class="card mb-4">
      <div class="card-body">
        <h2 class="card-title h5">Nueva publicación</h2>

        <form id="formPublicar">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre">
          </div>

          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="3" placeholder="Escribe tu mensaje"></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Publicar</button>
        </form>
      </div>
    </div>

    <!-- Aquí van a aparecer las publicaciones (Historia 2) -->
    <div id="listaPublicaciones"></div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Nuestro JS -->
  <script src="../js/app.js"></script>
</body>
</html>
